<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpaceGraph.js - Demos</title>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #111;
            color: #eee;
        }

        #spacegraph-container {
            position: absolute;
            left: 300px;
            top: 0;
            width: calc(100vw - 300px);
            height: 100vh;
        }

        #sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 300px;
            height: 100vh;
            background-color: rgba(20, 20, 30, 0.85);
            backdrop-filter: blur(10px);
            border-right: 1px solid #333;
            box-sizing: border-box;
            padding: 20px;
            color: #eee;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .sidebar-header h2 {
            margin: 0;
            color: #00ffff;
            font-weight: 500;
        }

        .sidebar-content {
            overflow-y: auto;
        }

        .sidebar-section .section-title {
            font-size: 12px;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 10px;
        }

        .menu-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .menu-list li {
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .menu-list li.active {
            background-color: #00ffff;
            color: #111;
            font-weight: bold;
        }

        .menu-list li:not(.active):hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .info-box {
            background-color: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 8px;
        }

        .info-box p {
            margin: 0 0 10px;
        }

        .info-box p:last-child {
            margin-bottom: 0;
        }

        /* General widget styling */
        .widget {
            background-color: rgba(30, 30, 45, 0.9);
            border: 1px solid #555;
            border-radius: 12px;
            padding: 20px;
            width: 300px;
            box-sizing: border-box;
            font-size: 14px;
            color: #eee;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
        }

        .widget h3 {
            margin-top: 0;
            color: #00ffff;
            font-weight: 500;
        }

        /* Profile Card */
        .profile-card {
            text-align: center;
        }
        .profile-card img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 2px solid #00ffff;
        }
        .profile-card .name {
            font-size: 18px;
            font-weight: bold;
            margin: 10px 0 5px;
        }
        .profile-card .title {
            font-size: 14px;
            color: #aaa;
        }

        /* Form Widget */
        .form-widget label {
            display: block;
            margin: 10px 0 5px;
            color: #aaa;
        }
        .form-widget input, .form-widget select {
            width: 100%;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #555;
            background-color: #333;
            color: #eee;
            box-sizing: border-box;
        }
        .form-widget input[type="range"] {
            padding: 0;
        }
        .form-widget input[type="color"] {
            padding: 2px;
            height: 30px;
        }
        .form-widget button {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background-color: #00ffff;
            color: #111;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Bar Chart */
        .chart-widget .chart {
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            height: 150px;
            border-bottom: 1px solid #555;
        }
        .chart-widget .bar {
            width: 20%;
            background-color: #00ffff;
            transition: height 0.3s ease;
        }

        /* Text Panel */
        .text-panel {
            height: 250px;
            overflow-y: auto;
        }
        .text-panel p {
            line-height: 1.6;
        }
        /* Custom scrollbar for webkit browsers */
        .text-panel::-webkit-scrollbar {
            width: 8px;
        }
        .text-panel::-webkit-scrollbar-track {
            background: #222;
        }
        .text-panel::-webkit-scrollbar-thumb {
            background-color: #555;
            border-radius: 4px;
        }

        /* Video Player */
        .video-widget video {
            width: 100%;
            border-radius: 8px;
        }

    </style>
</head>
<body>
    <div id="sidebar">
        <div class="sidebar-header">
            <h2>SpaceGraph.js</h2>
        </div>
        <div class="sidebar-content">
            <div class="sidebar-section">
                <div class="section-title">Demos</div>
                <ul id="demo-list" class="menu-list">
                    <!-- Demos will be dynamically inserted here -->
                </ul>
            </div>
            <div class="sidebar-section">
                <div class="section-title">Demo Info</div>
                <div class="info-box">
                    <p><strong id="demo-title"></strong></p>
                    <p id="demo-description"></p>
                </div>
            </div>
        </div>
    </div>
    <div id="spacegraph-container"></div>
    <script type="module" src="/main.js"></script>
    <script type="module">
        // This script depends on `demoManager` being exposed on the window object in main.js
        document.addEventListener('DOMContentLoaded', () => {
            const demoManager = window.demoManager;
            if (!demoManager) {
                console.error('DemoManager not found on window object.');
                return;
            }

            const demoList = document.getElementById('demo-list');
            const demoTitle = document.getElementById('demo-title');
            const demoDescription = document.getElementById('demo-description');

            // Populate the demo list
            Object.keys(demoManager.demos).forEach(demoName => {
                const li = document.createElement('li');
                li.textContent = demoName;
                li.dataset.demoName = demoName;
                if (demoManager.activeDemo.name === demoName) {
                    li.classList.add('active');
                }
                demoList.appendChild(li);
            });

            // Handle demo selection
            demoList.addEventListener('click', async (event) => {
                if (event.target.tagName === 'LI') {
                    const demoName = event.target.dataset.demoName;
                    await demoManager.load(demoName);
                }
            });

            // Update UI when a demo is loaded
            window.addEventListener('demo:loaded', ({ detail: demo }) => {
                demoTitle.textContent = demo.name;
                demoDescription.textContent = demo.description;

                // Update active state in the list
                demoList.querySelectorAll('li').forEach(li => {
                    li.classList.toggle('active', li.dataset.demoName === demo.name);
                });
            });

            // Update the initial info box
            const initialDemo = demoManager.activeDemo;
            demoTitle.textContent = initialDemo.name;
            demoDescription.textContent = initialDemo.description;
        });
    </script>
</body>
</html>
